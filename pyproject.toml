[project]
name = "nanoserve"
version = "0.1.0"
description = "A readable LLM inference engine: continuous batching, paged KV cache, tensor parallelism"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "safetensors",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanoserve"]
