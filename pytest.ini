# pythonpath=. puts the repo root on sys.path so `import nanoserve` works
# no matter how pytest is invoked. Without it, only `python -m pytest`
# works (that form adds the current directory itself); the bare `pytest`
# command does not.
[pytest]
# benchmarks too, so the harness can be tested against a fake model.
pythonpath = . benchmarks
testpaths = test
# Slow tests download ~2.5 GB of HF checkpoints, so they are opt-in:
# run them explicitly with `pytest -m slow` (the command line overrides this).
addopts = -m "not slow"
